name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_call:   # reused by release.yml

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofmt needed on:"; echo "$unformatted"; exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -coverprofile=coverage.out ./... | tee test_result.txt

    - name: Coverage report
      run: |
        go tool cover -html=coverage.out -o coverage.html
        go tool cover -func=coverage.out > coverage_func.txt
        {
          echo "## Test coverage"
          echo
          echo '```'
          cat coverage_func.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Go test results
      uses: actions/upload-artifact@v4
      with:
        name: Go-TestResults
        path: test_result.txt

    - name: Upload Go test coverage
      uses: actions/upload-artifact@v4
      with:
        name: Go-TestCoverage
        path: |
          coverage.out
          coverage.html
          coverage_func.txt
