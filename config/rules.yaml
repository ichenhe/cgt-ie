# Irish tax parameters. Edit here when a Finance Act changes something.
# See docs/irish-tax-rules.md for the rules and their sources.

cgt:
  # Rate by disposal date. s.28 TCA 1997; Budget 2027 cut 33% -> 31% for
  # disposals on or after 7 October 2026 (Finance (No. 2) Bill 2026).
  rates:
    - from: 2012-12-06
      rate: 0.33
    - from: 2026-10-07
      rate: 0.31
  annual_exemption: 1270
  # s.581(1)(2): disposals matched against acquisitions within this many
  # days before the disposal (LIFO), then FIFO.
  matching_window_days: 28
  # s.581(3): loss restricted if same-class shares reacquired within this
  # many days after the disposal.
  reacquisition_window_days: 28

exit_tax:
  deemed_disposal_years: 8
  # s.747E; 41% to end-2025, 38% from 2026 (FA 2025), 35% from 2027
  # (Finance (No. 2) Bill 2026).
  rates:
    - from: 2014-01-01
      rate: 0.41
    - from: 2026-01-01
      rate: 0.38
    - from: 2027-01-01
      rate: 0.35
